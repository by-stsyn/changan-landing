name: Deploy to Reg.ru (sale.pragmatika-changanauto.ru)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build

      # Шаг выгрузки на Reg.ru по FTP (срабатывает, если в GitHub Secrets указан REG_RU_FTP_SERVER)
      # Если секреты еще не заданы, шаг будет безопасно пропущен
      - name: Deploy to Reg.ru via FTP
        if: ${{ secrets.REG_RU_FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.REG_RU_FTP_SERVER }}
          username: ${{ secrets.REG_RU_FTP_USERNAME }}
          password: ${{ secrets.REG_RU_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
